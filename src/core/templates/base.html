<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}UrbanTrend - Catálogo Streetwear{% endblock %}</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS & Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar-custom {
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
        }

        .main-wrapper {
            flex: 1 0 auto;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .card {
            border-radius: 12px;
            border: 1px solid #576679;
        }

        .table-custom th {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-soft-primary { background-color: #e0f2fe; color: #0369a1; }
        .badge-soft-danger { background-color: #ffe4e6; color: #be123c; }
        .badge-soft-warning { background-color: #fef3c7; color: #b45309; }
        .badge-soft-secondary { background-color: #f1f5f9; color: #475569; }
        .badge-soft-success { background-color: #dcfce7; color: #15803d; }
    </style>
</head>
<body>

    <!-- Header / Barra de Navegación Global -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'store:list' %}">
                <i class="bi bi-shop text-primary fs-4"></i>
                <span>UrbanTrend <span class="badge bg-primary text-uppercase fs-6">Lab 03</span></span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-2 mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link fw-medium px-3" href="{% url 'store:list' %}">
                            <i class="bi bi-grid-fill me-1"></i> Catálogo
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-medium px-3 text-info" href="{% url 'logistics:index' %}">
                            <i class="bi bi-box-seam-fill me-1"></i> Logística & Insumos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary btn-sm fw-semibold px-3 py-2 rounded-pill shadow-sm" href="{% url 'store:create' %}">
                            <i class="bi bi-plus-lg me-1"></i> + Nueva Prenda
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="main-wrapper">
        {% if messages %}
            <div class="container-fluid px-0 mb-4">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}
    </main>

    <!-- Pie de página -->
    <footer class="bg-white border-top py-3 mt-auto">
        <div class="container text-center text-muted small">
            <span>UrbanTrend Streetwear &copy; 2026 — Django ORM & SQLite Persistente (Lab 03)</span>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
